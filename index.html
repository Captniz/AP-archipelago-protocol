<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>PDF Preview</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font-family: system-ui, sans-serif;
                background: #f1f3f5;
            }
            header {
                padding: 16px 24px;
                background: #fff;
                border-bottom: 1px solid #ddd;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            iframe {
                display: block;
                width: 100%;
                height: calc(100vh - 65px);
                border: 0;
            }
            a {
                color: #0969da;
            }
        </style>
    </head>
    <body>
        <header>
            <strong>PDF Preview</strong>
            <a href="./protocol.pdf" target="_blank"> Open PDF </a>
        </header>

        <iframe src="./protocol.pdf#view=FitH" title="PDF preview"> </iframe>
    </body>
</html>
